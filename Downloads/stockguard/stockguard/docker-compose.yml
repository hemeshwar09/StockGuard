services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stockguard
      POSTGRES_PASSWORD: stockguard
      POSTGRES_DB: stockguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockguard -d stockguard"]
      interval: 3s
      timeout: 3s
      retries: 15

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://stockguard:stockguard@db:5432/stockguard
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key}
      INVENTORY_STRATEGY: ${INVENTORY_STRATEGY:-atomic}
      RESERVATION_TTL_SECONDS: ${RESERVATION_TTL_SECONDS:-600}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
