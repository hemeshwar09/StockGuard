# Render Blueprint: one-click deploy of the API + a managed Postgres database.
# Render dashboard -> New -> Blueprint -> pick this repo.
# Check Render's current plan names/limits; free Postgres instances expire.
services:
  - type: web
    name: stockguard
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stockguard-db
          property: connectionString
      - key: ADMIN_API_KEY
        generateValue: true
      - key: INVENTORY_STRATEGY
        value: atomic
      - key: RESERVATION_TTL_SECONDS
        value: "600"

databases:
  - name: stockguard-db
    plan: free
